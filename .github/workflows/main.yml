name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'paplo'
        required: true
        default: 'paplo'
      agent_description:
        description: 'paplo'
        required: true
        default: 'finder AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Step 1 - Install ClawHub
        run: npx clawhub@latest install verified-agent-identity

      - name: Install dependencies
        run: |
          if [ -d "scripts" ]; then
            cd scripts
            npm install
         

      - name: Step 2 - Create new Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Step 3 - View Agent verification link
        run: |
          node scripts/manualLinkHumanToAgent.js --challenge '{"name": "paplo", "description": "paplo AI Agent"}'
